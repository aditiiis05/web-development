<!DOCTYPE html>
<html>
    <head>
        <font face="Lato" size="4">Roll no-109</font>
        <title>HTML Lists</title>
    </head>
    <body>
        <h1>Ordered Lists</h1>
        <ol>
            <li>Apple</li>
            <li>Mango</li>
            <li>Banana</li>
            <li>Orange</li>
            <li>Papaya</li>
        </ol>
        <h1>Unordered List</h1>
        <ul>
            <li>Potato</li>
            <li>Cabbage</li>
            <li>Onion</li>
            <li>Capsicum</li>
            <li>Tomato</li>
        </ul>
        <h1>Defination List</h1>
        <dl>
            <dt>Cristiano Ronaldo</dt>
            <dd>CR is a GOAT</dd>
        </dl>
    </body>
</html>
